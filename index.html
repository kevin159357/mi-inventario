<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Mi Inventario</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="appShell" class="app-shell" aria-live="polite">
    <div id="loadingScreen" class="screen screen--centered is-active">
      <div class="loading-card">
        <div class="brand-mark">📦</div>
        <h1>Cargando Mi Inventario</h1>
        <p>Preparando la base de datos local…</p>
        <div class="spinner" aria-label="Cargando"></div>
      </div>
    </div>

    <div id="startScreen" class="screen screen--centered" hidden>
      <section class="welcome-card">
        <div class="brand-mark brand-mark--large">📦</div>
        <p class="eyebrow">Inventario local</p>
        <h1 id="startAppName">Mi Inventario</h1>
        <p class="muted">Elige cómo quieres entrar.</p>
        <div class="stack stack--lg">
          <button class="btn btn--primary btn--xl" data-action="enter-client">👤 Modo cliente</button>
          <button class="btn btn--dark btn--xl" data-action="open-admin-login">🔐 Modo administrador</button>
        </div>
      </section>
    </div>

    <div id="adminScreen" class="screen" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Administrador</p>
          <h1 id="adminAppName">Mi Inventario</h1>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" title="Configuración" aria-label="Configuración" data-action="open-settings">⚙️</button>
          <button class="icon-btn" title="Salir" aria-label="Salir" data-action="logout-admin">🚪</button>
        </div>
      </header>

      <main class="content">
        <section id="dashboardSection" class="section-block">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Resumen</p>
              <h2>Dashboard</h2>
            </div>
          </div>
          <div id="dashboardCards" class="stats-grid"></div>
        </section>

        <section id="folderSection" class="section-block">
          <div class="section-heading section-heading--wrap">
            <div>
              <p class="eyebrow">Organización</p>
              <h2>Carpetas</h2>
            </div>
            <button class="btn btn--primary" data-action="create-folder">➕ Crear carpeta</button>
          </div>

          <div class="toolbar">
            <label class="search-field">
              <span>🔎</span>
              <input id="folderSearchInput" type="search" placeholder="Buscar carpeta…" autocomplete="off">
              <button class="search-clear" type="button" data-action="clear-folder-search" aria-label="Limpiar búsqueda">✕</button>
            </label>
          </div>

          <div id="folderGrid" class="folder-grid"></div>
        </section>
      </main>
    </div>

    <div id="folderInventoryScreen" class="screen" hidden>
      <header class="topbar topbar--sticky">
        <div class="topbar__leading">
          <button class="icon-btn" data-action="back-admin" aria-label="Volver">←</button>
          <div>
            <p class="eyebrow">Inventario</p>
            <h1 id="folderInventoryTitle">Carpeta</h1>
          </div>
        </div>
        <button class="btn btn--primary" data-action="create-product">➕ Añadir producto</button>
      </header>

      <main class="content">
        <div class="toolbar toolbar--split">
          <label class="search-field">
            <span>🔎</span>
            <input id="productSearchInput" type="search" placeholder="Buscar por nombre o código…" autocomplete="off">
            <button class="search-clear" type="button" data-action="clear-product-search" aria-label="Limpiar búsqueda">✕</button>
          </label>
          <select id="productSortSelect" class="select-control" aria-label="Ordenar productos">
            <option value="name-asc">Nombre A-Z</option>
            <option value="name-desc">Nombre Z-A</option>
            <option value="stock-desc">Mayor stock</option>
            <option value="stock-asc">Menor stock</option>
            <option value="updated-desc">Última modificación</option>
          </select>
        </div>
        <div id="productGrid" class="product-grid"></div>
      </main>
    </div>

    <div id="clientScreen" class="screen" hidden>
      <header class="topbar topbar--sticky">
        <div>
          <p class="eyebrow">Modo cliente</p>
          <h1 id="clientFolderTitle">Productos</h1>
        </div>
        <button class="icon-btn" title="Entrar como administrador" aria-label="Entrar como administrador" data-action="client-admin-unlock">🔒</button>
      </header>
      <main class="content">
        <div class="toolbar">
          <label class="search-field">
            <span>🔎</span>
            <input id="clientSearchInput" type="search" placeholder="Buscar producto…" autocomplete="off">
            <button class="search-clear" type="button" data-action="clear-client-search" aria-label="Limpiar búsqueda">✕</button>
          </label>
        </div>
        <div id="clientProductGrid" class="product-grid product-grid--client"></div>
      </main>
    </div>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="assertive"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <input id="restoreFileInput" type="file" accept="application/json,.json" hidden>

  <script src="js/namespace.js"></script>
  <script src="js/database.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/folders.js"></script>
  <script src="js/products.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
